<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slice Engine — Slicing Game</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0b12;
        font-family: system-ui, sans-serif;
      }
      #scene {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      .hint {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        color: #cfcfe6;
        opacity: 0.7;
        font-size: 14px;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="hint">Swipe across a fruit to slice it</div>
    <script type="module">
      import { startSlicingGame } from './src/main.ts';
      const canvas = document.getElementById('scene');
      startSlicingGame(canvas);
    </script>
  </body>
</html>
